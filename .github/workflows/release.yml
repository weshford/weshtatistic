name: Build GitHub Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux binary and Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev
          ./scripts/package_deb.sh \
            --binary target/release/weshtatistic \
            --out-dir dist

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/release/weshtatistic AppDir/usr/bin/weshtatistic
          cp assets/linux/weshtatistic.desktop AppDir/weshtatistic.desktop
          cp assets/linux/weshtatistic.desktop AppDir/usr/share/applications/weshtatistic.desktop
          cp crates/weshtatistic/assets/img/icon_512x.png AppDir/weshtatistic.png
          cp crates/weshtatistic/assets/img/icon_512x.png AppDir/usr/share/icons/hicolor/512x512/apps/weshtatistic.png
          chmod +x AppDir/usr/bin/weshtatistic

          curl --fail --location --retry 3 \
            --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage AppDir "dist/weshtatistic-${{ github.event.release.tag_name }}-linux-x86_64.AppImage"

      - name: Stage portable binary
        run: |
          mkdir -p dist
          cp target/release/weshtatistic dist/weshtatistic-${{ github.event.release.tag_name }}-linux-x86_64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Windows portable binary and installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\weshtatistic.exe dist\weshtatistic.exe
          Compress-Archive -Path dist\weshtatistic.exe -DestinationPath "dist\weshtatistic-${{ github.event.release.tag_name }}-windows-x86_64-portable.zip"
          Remove-Item dist\weshtatistic.exe

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\weshtatistic.exe target\release\weshtatistic.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*?)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version /F"weshtatistic-$version-setup-x86_64" installer.iss
          Copy-Item staging\weshtatistic-*-setup-x86_64.exe dist\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/
          if-no-files-found: error

  build-macos:
    name: macOS package
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build unsigned package
        run: ./scripts/package_macos.sh --target "${{ matrix.target }}" --unsigned --validate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets-${{ matrix.target }}
          path: |
            weshtatistic-macos-*.dmg
            weshtatistic-macos-*.zip
          if-no-files-found: error

  publish:
    name: Publish assets to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: dist

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - name: Download macOS Apple Silicon assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets-aarch64-apple-darwin
          path: dist

      - name: Download macOS Intel assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets-x86_64-apple-darwin
          path: dist

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
